version: "3.8"

services:
  mongodb:
    image: mongo:7
    container_name: intubemedia-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: intubemedia-backend
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/intubemedia
      - JWT_SECRET=${JWT_SECRET:-intubemedia-dev-secret}
      - FRONTEND_URL=http://localhost:3000
    depends_on:
      - mongodb
    volumes:
      - ./backend:/app
      - /app/node_modules
      - uploads:/app/uploads
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: intubemedia-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    restart: unless-stopped

volumes:
  mongo-data:
  uploads:
